<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Détails Catégorie - E-shop</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="nav">
      <div class="nav-left"><h2 class="logo">E-Shop</h2></div>
      <div class="nav-right">
        <span id="username"></span>
        <select id="langSelectTop">
          <option value="fr">FR</option>
          <option value="en">EN</option>
          <option value="ar">AR</option>
        </select>
        <button id="themeToggle" class="btn">Dark Mode</button>
        <button id="logoutBtn" class="btn" data-i18n="btn_logout">Déconnexion</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav>
          <a href="dashboard.html" data-i18n="nav_dashboard">Tableau de bord</a>
          <a href="products.html" data-i18n="nav_products">Produits</a>
          <a href="categories.html" data-i18n="nav_categories">Catégories</a>
          <a href="orders.html" data-i18n="nav_orders">Commandes</a>
          <a href="users.html" data-i18n="nav_users">Utilisateurs</a>
          <a href="reviews.html" data-i18n="nav_reviews">Avis</a>
        </nav>
      </aside>

      <main class="main">
        <div class="card" id="categoryCard">
          <div class="row between">
            <h2 id="cd_name" data-i18n="title_category_detail">Détails de la catégorie</h2>
            <div>
              <button id="exportPdfBtn" class="btn" data-i18n="btn_export_pdf">Export PDF</button>
              <a id="editLink" class="btn" data-i18n="btn_edit">Modifier</a>
              <a href="categories.html" class="btn" data-i18n="btn_back">Retour</a>
              <button id="delBtn" class="btn danger" data-i18n="btn_delete">Supprimer</button>
            </div>
          </div>
          <div style="margin-top:20px;">
            <p id="cd_desc" style="margin-bottom:16px;"></p>
            <ul style="list-style:none;padding:0;">
              <li style="padding:8px 0;border-bottom:1px solid var(--border);"><strong data-i18n="label_name">Nom:</strong> <span id="cd_name_val"></span></li>
              <li style="padding:8px 0;border-bottom:1px solid var(--border);"><strong data-i18n="label_description">Description:</strong> <span id="cd_desc_val"></span></li>
              <li style="padding:8px 0;"><strong>Produits:</strong> <span id="cd_products"></span></li>
            </ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    requireAuth();
    initApp();
    const session = getSession();
    document.getElementById('username').textContent = session.name + " (" + session.role + ")";
    document.getElementById('logoutBtn').addEventListener('click', logout);

    const sel = document.getElementById('langSelectTop');
    sel.value = localStorage.getItem('ecom_lang') || 'fr';
    sel.addEventListener('change', e => {
      loadLang(e.target.value).then(() => {
        initTheme();
        renderCategory();
      });
    });

    function renderCategory() {
      const params = new URLSearchParams(location.search);
      const id = Number(params.get('id'));
      const c = getAll('categories').find(x => x.id === id);
      if (!c) {
        document.getElementById('categoryCard').innerHTML = `<p>${t('msg_category_not_found')}</p>`;
      } else {
        document.getElementById('cd_name').textContent = c.name;
        document.getElementById('cd_name_val').textContent = c.name;
        document.getElementById('cd_desc').textContent = c.description || '—';
        document.getElementById('cd_desc_val').textContent = c.description || '—';
        const productCount = getAll('products').filter(p => p.categoryId === c.id).length;
        document.getElementById('cd_products').textContent = productCount;
        document.getElementById('exportPdfBtn').addEventListener('click', () => {
          html2pdf().from(document.getElementById('categoryCard')).save(`${c.name}.pdf`);
        });
        document.getElementById('editLink').href = `categories.html?edit=${c.id}`;
        document.getElementById('delBtn').addEventListener('click', () => {
          if (productCount > 0) {
            Swal.fire({
              icon: 'error',
              title: 'Erreur',
              text: `Cette catégorie contient ${productCount} produit(s). Supprimez d'abord les produits.`
            });
            return;
          }
          Swal.fire({
            title: t('msg_confirm_delete'),
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: t('btn_confirm'),
            cancelButtonText: t('btn_cancel')
          }).then((result) => {
            if (result.isConfirmed) {
              remove('categories', c.id);
              Swal.fire({
                icon: 'success',
                title: t('msg_delete_success'),
                timer: 1500,
                showConfirmButton: false
              }).then(() => {
                location.href = 'categories.html';
              });
            }
          });
        });
      }
    }

    loadLang(localStorage.getItem('ecom_lang') || 'fr').then(() => {
      renderCategory();
      initTheme();
    });
  </script>

</body>
</html>
