<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Commandes - E-shop</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="app">
    <header class="nav">
      <div class="nav-left"><h2 class="logo">E-Shop</h2></div>
      <div class="nav-right">
        <span id="username"></span>
        <select id="langSelectTop">
          <option value="fr">FR</option>
          <option value="en">EN</option>
          <option value="ar">AR</option>
        </select>
        <button id="themeToggle" class="btn">Dark Mode</button>
        <button id="logoutBtn" class="btn" data-i18n="btn_logout">Déconnexion</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav>
          <a href="dashboard.html" data-i18n="nav_dashboard">Tableau de bord</a>
          <a href="products.html" data-i18n="nav_products">Produits</a>
          <a href="categories.html" data-i18n="nav_categories">Catégories</a>
          <a href="orders.html" class="active" data-i18n="nav_orders">Commandes</a>
          <a href="users.html" data-i18n="nav_users">Utilisateurs</a>
          <a href="reviews.html" data-i18n="nav_reviews">Avis</a>
        </nav>
      </aside>

      <main class="main">
        <div class="card">
          <div class="row between">
            <h2 data-i18n="title_orders">Commandes</h2>
            <div>
              <button id="btnAdd" class="btn primary" data-i18n="add_order">Nouvelle commande</button>
              <button id="exportCsv" class="btn" data-i18n="btn_export_csv">Export CSV</button>
            </div>
          </div>

          <div class="filters">
            <input id="search" data-i18n-placeholder="label_search" placeholder="Recherche..." />
            <select id="filterStatus">
              <option value="" data-i18n="label_all_status">Tous les statuts</option>
              <option value="pending" data-i18n="status_pending">En attente</option>
              <option value="processing" data-i18n="status_processing">En cours</option>
              <option value="completed" data-i18n="status_completed">Terminé</option>
              <option value="cancelled" data-i18n="status_cancelled">Annulé</option>
            </select>
            <select id="perPage">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
          </div>

          <table class="table" id="ordersTable">
            <thead>
              <tr>
                <th data-sort="id">ID</th>
                <th data-sort="userId" data-i18n="label_user">Utilisateur</th>
                <th data-sort="total" data-i18n="label_total">Total</th>
                <th data-sort="status" data-i18n="label_status">Statut</th>
                <th data-sort="date" data-i18n="label_date">Date</th>
                <th data-i18n="btn_view">Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

          <div class="pagination" id="pagination"></div>
        </div>

        <!-- Modal / Form -->
        <div id="modal" class="modal hidden">
          <div class="modal-content card">
            <h3 id="modalTitle" data-i18n="add_order">Nouvelle commande</h3>
            <form id="orderForm">
              <input type="hidden" id="orderId" />
              <label data-i18n="label_user">Utilisateur</label>
              <select id="o_user" required></select>
              <label data-i18n="label_status">Statut</label>
              <select id="o_status" required>
                <option value="pending" data-i18n="status_pending">En attente</option>
                <option value="processing" data-i18n="status_processing">En cours</option>
                <option value="completed" data-i18n="status_completed">Terminé</option>
                <option value="cancelled" data-i18n="status_cancelled">Annulé</option>
              </select>
              <div class="row end">
                <button type="submit" class="btn primary" data-i18n="btn_save">Enregistrer</button>
                <button type="button" class="btn" id="cancelModal" data-i18n="btn_cancel">Annuler</button>
              </div>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/orders.js"></script>
  <script>
    requireAuth();
    initApp();
    const session = getSession();
    document.getElementById('username').textContent = session.name + " (" + session.role + ")";
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // Populate user select
    const userSelect = document.getElementById('o_user');
    getAll('users').forEach(u => {
      const opt = document.createElement('option');
      opt.value = u.id;
      opt.textContent = u.name;
      userSelect.appendChild(opt);
    });

    const sel = document.getElementById('langSelectTop');
    sel.value = localStorage.getItem('ecom_lang') || 'fr';
    sel.addEventListener('change', e => {
      loadLang(e.target.value).then(() => {
        initOrdersPage();
        initTheme();
      });
    });

    loadLang(localStorage.getItem('ecom_lang') || 'fr').then(() => {
      initOrdersPage();
      initTheme();
    });
  </script>

</body>
</html>
