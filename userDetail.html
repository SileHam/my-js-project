<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Détails Utilisateur - E-shop</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="nav">
      <div class="nav-left"><h2 class="logo">E-Shop</h2></div>
      <div class="nav-right">
        <span id="username"></span>
        <select id="langSelectTop">
          <option value="fr">FR</option>
          <option value="en">EN</option>
          <option value="ar">AR</option>
        </select>
        <button id="themeToggle" class="btn">Dark Mode</button>
        <button id="logoutBtn" class="btn" data-i18n="btn_logout">Déconnexion</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <nav>
          <a href="dashboard.html" data-i18n="nav_dashboard">Tableau de bord</a>
          <a href="products.html" data-i18n="nav_products">Produits</a>
          <a href="categories.html" data-i18n="nav_categories">Catégories</a>
          <a href="orders.html" data-i18n="nav_orders">Commandes</a>
          <a href="users.html" data-i18n="nav_users">Utilisateurs</a>
          <a href="reviews.html" data-i18n="nav_reviews">Avis</a>
        </nav>
      </aside>

      <main class="main">
        <div class="card" id="userCard">
          <div class="row between">
            <h2 id="ud_name" data-i18n="title_user_detail">Détails de l'utilisateur</h2>
            <div>
              <button id="exportPdfBtn" class="btn" data-i18n="btn_export_pdf">Export PDF</button>
              <a id="editLink" class="btn" data-i18n="btn_edit">Modifier</a>
              <a href="users.html" class="btn" data-i18n="btn_back">Retour</a>
              <button id="delBtn" class="btn danger" data-i18n="btn_delete">Supprimer</button>
            </div>
          </div>
          <div style="margin-top:20px;">
            <ul style="list-style:none;padding:0;">
              <li style="padding:8px 0;border-bottom:1px solid var(--border);"><strong data-i18n="label_name">Nom:</strong> <span id="ud_name_val"></span></li>
              <li style="padding:8px 0;border-bottom:1px solid var(--border);"><strong data-i18n="label_email">Email:</strong> <span id="ud_email"></span></li>
              <li style="padding:8px 0;border-bottom:1px solid var(--border);"><strong data-i18n="label_role">Rôle:</strong> <span id="ud_role"></span></li>
              <li style="padding:8px 0;"><strong>Commandes:</strong> <span id="ud_orders"></span></li>
            </ul>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    requireAuth();
    initApp();
    const session = getSession();
    document.getElementById('username').textContent = session.name + " (" + session.role + ")";
    document.getElementById('logoutBtn').addEventListener('click', logout);

    const sel = document.getElementById('langSelectTop');
    sel.value = localStorage.getItem('ecom_lang') || 'fr';
    sel.addEventListener('change', e => {
      loadLang(e.target.value).then(() => {
        initTheme();
        renderUser();
      });
    });

    function renderUser() {
      const params = new URLSearchParams(location.search);
      const id = Number(params.get('id'));
      const u = getAll('users').find(x => x.id === id);
      if (!u) {
        document.getElementById('userCard').innerHTML = `<p>${t('msg_user_not_found')}</p>`;
      } else {
        document.getElementById('ud_name').textContent = u.name;
        document.getElementById('ud_name_val').textContent = u.name;
        document.getElementById('ud_email').textContent = u.email;
        document.getElementById('ud_role').innerHTML = `<span class="role-badge role-${u.role}">${t(`role_${u.role}`)}</span>`;
        const orderCount = getAll('orders').filter(o => o.userId === u.id).length;
        document.getElementById('ud_orders').textContent = orderCount;
        document.getElementById('exportPdfBtn').addEventListener('click', () => {
          html2pdf().from(document.getElementById('userCard')).save(`${u.name}.pdf`);
        });
        document.getElementById('editLink').href = `users.html?edit=${u.id}`;
        document.getElementById('delBtn').addEventListener('click', () => {
          if (id === session.id) {
            Swal.fire({
              icon: 'error',
              title: 'Erreur',
              text: 'Vous ne pouvez pas supprimer votre propre compte'
            });
            return;
          }
          Swal.fire({
            title: t('msg_confirm_delete'),
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: t('btn_confirm'),
            cancelButtonText: t('btn_cancel')
          }).then((result) => {
            if (result.isConfirmed) {
              remove('users', u.id);
              Swal.fire({
                icon: 'success',
                title: t('msg_delete_success'),
                timer: 1500,
                showConfirmButton: false
              }).then(() => {
                location.href = 'users.html';
              });
            }
          });
        });
      }
    }

    loadLang(localStorage.getItem('ecom_lang') || 'fr').then(() => {
      renderUser();
      initTheme();
    });
  </script>

</body>
</html>
